topic: 冷凍肉の解凍（解凍プレートの仕組み）
viewer_question: レンジの解凍や自然解凍がうまくいかないのはなぜか。金属のプレートに乗せるだけで本当に変わるのか。
audience: 一般視聴者・料理の専門知識なし・スマホで視聴
source_urls:
- https://tpds.db.aist.go.jp/opendata/metal_tc.html
- https://cb-j.com/products/001-73/
verified_facts:
- 産総研 分散型熱物性データベースの「文献調査から見る金属単体の熱伝導率」一覧では、アルミニウム（Al）の熱伝導率は室温付近で
  226〜237 W/mK、鉄（Fe）は 72〜80.4 W/mK と記載されている（いずれも「文献・材料によって値が異なる」と注記）。
- 同データベースのアームコ鉄は 72.8 W/mK。アルミ（226〜237）と鉄（72〜80.4）を比べると約2.8〜3.3倍。
- 株式会社シービージャパンの公式商品ページは、解凍プレートについて「熱伝導性の高いアルミニウムのおかげ」と説明し、
  「普通に食材を放置するよりも解凍時間や粗熱取りの時短になります」と記載している。
- 同ページは「3mm の厚めのアルミニウムを使用しているため、より熱伝導率が高く、食材の解凍時間を早めることに成功しました」
  「実際に解凍プレートとまな板で10分間の氷の溶け方を比較しました」と記載している。
caveats:
- 熱伝導率の値は文献・材料によって異なる。産総研の一覧にもその旨の注記がある。
- 解凍の速さはプレートの厚み・材質・食材との接触面積・室温で変わる。製品ごとの「自然解凍の何倍」等の数値は公的資料で確認していないので使わない。
- シービージャパンのページは特定商品の販売元による自社製品の説明であり、汎用の性能比較データではない。
- 食品衛生（中心温度・再加熱）の話は本題と別なので扱わない。
- 本動画は商品画像を使わない。楽天の商品画像はアフィリエイト規約上、動画への焼き込みが明文で許諾されていないため。
visual_assets: すべてAI生成の情景イメージと模式図。実在の商品・ロゴ・店舗名は描かない。数値はテロップで表示する。
