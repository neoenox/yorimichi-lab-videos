topic: "江戸図の「最古版」は、本当に1632年なのか"
viewer_question: "古い地図の作られた年は、どうやって決めるの？"
audience: "一般視聴者・予備知識なし"
source_urls:
  - "https://dl.ndl.go.jp/api/iiif/1286168/manifest.json"
  - "https://ndlsearch.ndl.go.jp/books/R100000002-I000007284816"
verified_facts:
  - "「武州豊嶋郡江戸〔庄〕図」は無刊記だが、現存する江戸図の最古版とされるとNDLが解説する"
  - "同図の出版年は「寛永9（1632）頃」とされ、屋敷名は寛永7、8年ごろの状況を示す"
  - "同解説は、版式からみてこの時期の刊行には疑問があり、後年の比較的早い時期ではないかとする"
  - "同図の収録地域は江戸城とその北・東・南の狭い範囲に限られ、周辺部は枠近くまで切除されている"
caveats:
  - "年代は刊記が無いため推定であり、断定はできない"
  - "展示・公開の可否はNDLの利用条件に従う（PDM）"
  - "原本の目視確認は行っていない（IIIFマニフェストの解説文で確認）"
visual_assets: "模式図（年表・3つの手がかり）、NDL解説文の引用画面"
