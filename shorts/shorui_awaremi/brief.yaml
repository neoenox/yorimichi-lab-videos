topic: "生類憐みの令は本当に悪法だったのか"
viewer_question: "犬ばかり大事にした法律って本当？"
audience: "一般視聴者・予備知識なし"
source_urls:
  - "https://www.jstage.jst.go.jp/article/seibutsugakushi/99/0/99_11/_pdf"
  - "https://www.soumu.metro.tokyo.lg.jp/01soumu-archives/07edo_tokyo/0703kaidoku/0703kaidoku_old/0703kaidoku01/0703kaidoku01_2"
  - "https://crd.ndl.go.jp/reference/entry/index.php?id=1000327707&page=ref_view"
verified_facts:
  - "J-Stageの研究論文は、生類憐みの令に対する『人命よりも動物の保護を優先した』という低い評価を紹介する一方、20世紀末から『単なる悪法ではない』という論調・記述になってきたと述べる（PDF本文45〜49行目、166〜223行目を確認）。"
  - "同論文は、令が1687年（貞享4年）1月の『病人・病牛馬の遺棄禁止令』から始まったと記す（147行目）。最初から犬だけを対象にした法令ではない。"
  - "同論文は、令の中の『生類』に人間が含まれることを指摘する。捨て子の禁止、囚人の獄死防止、病気になった町人の駕籠の利用などが含まれる（109〜110行目、123〜124行目）。"
  - "同論文が引用する記録では、1695年（元禄8年）に大久保・中野に犬小屋が設置され、中野犬小屋には10万頭に及ぶ犬が収容されたとある（329〜349行目）。"
  - "同論文の記録には、1702年（元禄15年）に犬を傷つけたとして切腹を命じられた例（伯楽橋本権之助）が載る（380行目）。厳罚の実例として使える。"
  - "NDLレファレンス（世田谷区立中央図書館）は、1692年頃に喜多見氏の陣屋跡へ犬屋敷が設置されたとする郷土史料を紹介する。"
caveats:
  - "『悪法ではなかった』と単純に言い切ると逆方向の誤解になる。『犬だけではなかったが、罰は厳しかった』の両方を伝える。"
  - "『世界最初の動物保護法』という評価は论文内で小佐々(2013)の見解として紹介されている。動画では断定せず、研究上の再評価として扱う。"
  - "10万頭という数字は論文が引用する記録の『といへり』という伝聞表現。断定せず『といわれた』とする。"
  - "東京都公文書館のページは町触（まちぶれ）という記録全般の解説で、生類憐み政策の直接の原文ではない。画面の出典表示には使わない。"
visual_assets: "江戸の町並みの模式図、令の対象（人・牛馬・犬）を並べた比較図、犬小屋の模式図。すべて模式図と明記する"
