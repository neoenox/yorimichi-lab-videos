topic: 平均年収478万円のカラクリ（平均と「いちばん多い給与帯」のズレ）
viewer_question: 「平均年収478万円」って、自分や周りの感覚と違いませんか？ 平均は誰のこと？
audience: 一般視聴者・自分の年収が気になる人・統計の読み方を知りたい人
source_urls:
  - "https://www.nta.go.jp/information/release/kokuzeicho/2025/minkan_2025/pdf/01.pdf"
  - "https://www.nta.go.jp/publication/statistics/kokuzeicho/minkan2024/pdf/R06_001.pdf"
verified_facts:
  - "国税庁「令和6年分民間給与実態統計調査結果について」（令和7年9月公表、2026-11-23にPDF取得し本文確認）: 1年を通じて勤務した給与所得者の平均給与は478万円で、前年比3.9%増・4年連続増加・過去最高。男性587万円、女性333万円、正社員545万円、正社員以外206万円。"
  - "同資料: 民間の給与所得者数は6,077万人、給与総額は241兆4,388億円。1年を通じて勤務した給与所得者は5,137万人。"
  - "同庁「令和6年分民間給与実態統計調査 調査結果報告」p.22の給与階級別分布: 5,137万人のうち300万円超400万円以下が826万人（構成比16.1%）で最も多く、次いで400万円超500万円以下が787万人（同15.3%）。"
  - "つまり平均478万円に対して、最も人数が多い給与帯は300〜400万円。平均は高額所得者の影響を受け、『典型的な人』を表すとは限らない。"
  - "同報告書は性別の最頻階級も示す。男性は400万円超500万円以下493万人（16.9%）、女性は200万円超300万円以下421万人（19.0%）で最も多い。"
caveats:
  - "この調査は民間事業所の給与所得者が対象。公務員・個人事業主・所得のない人は含まれない。『日本人の全員の平均』ではない。"
  - "中央値（メジアン）はこの公表資料に数値が載っていない。動画では『中央値は◯万円』と断定せず、公表されている最頻階級と構成比を使う。"
  - "平均給与478万円は税込・賞与込みの給与総額。手取りではない。"
  - "令和6年分（2024年）の調査。2026年11月時点で公表されている最新の年次統計。"
visual_assets: "右肩上げの給与分布模式図。横軸に給与帯（100万刻み）、縦軸に人数。300〜400万円の山を大きく、平均478万円の縦線を右へずらして置く。『平均≠いちばん多い』を模式図と明記。"
