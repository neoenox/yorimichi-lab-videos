topic: "赤ちゃんは味を感じないのか"
viewer_question: "生まれたばかりの赤ちゃんに、味は分かるの？"
audience: "一般視聴者・予備知識なし"
source_urls:
  - "https://pmc.ncbi.nlm.nih.gov/articles/PMC3202923/"
  - "https://pmc.ncbi.nlm.nih.gov/articles/PMC5492973/"
verified_facts:
  - "Beauchamp & Mennella の総説（PMC3202923）は、甘味・塩味・うま味への好みと苦味への嫌悪が生得的に組織されていると述べる（要旨）。"
  - "同総説は、乳児は大人より甘味への好みが強く、その好みは経験によって修正されうるとする（Origin of Flavor Preferences 節）。"
  - "同総説は、塩味への感受性と好みに生得的な成分があり、約4か月で発達すると述べる（同節）。"
  - "同総説は、3〜4か月未満の乳児は苦味・酸味の強い加水分解タンパク質ミルクを拒否せず受け入れるが、5〜6か月の乳児は拒否することを報告する（Postnatal Flavor Learning via Infant Formula 節）。新生児が味を感じないのではなく、経験によって受け止め方が変わる。"
  - "同総説は、胎児期に羊水を通じて、出生後に母乳や粉ミルクを通じて風味の経験が蓄積され、後の好みを形作ると述べる（Prenatal/Postnatal Flavor Learning 節）。"
  - "PMC5492973 は、乳児の顔表情が味の受容・拒否の指標として研究に使われることを述べる（2026-11-23 に要旨確認）。"
caveats:
  - "『感じない』を単純に否定するだけでなく、好みが経験で形作られるという点も伝える。"
  - "『生得的』は総説の表現（innately organized）に沿う。『生まれつき完全に決まっている』と言い切らない。"
  - "4か月・5〜6か月という月齢は特定のStudyの結果。『だいたい』『頃』と留保して伝える。"
  - "前回の味覚マップ（大人の舌の話）と混同しない。今回は乳児の味の好みの発達がテーマ。"
visual_assets: "乳児の口元を想定した模式図、甘味・苦味の表情アイコン、月齢と好みの変化を並べた模式図。すべて模式図と明記する"
