topic: "江戸の古地図は、今の地図と重ねて比べられるのか"
viewer_question: "古地図を現代地図に重ねると、なぜずれるの？"
audience: "一般視聴者・予備知識なし"
source_urls:
  - "https://ndlsearch.ndl.go.jp/books/R100000002-I000007284816"
  - "https://dl.ndl.go.jp/api/iiif/1286168/manifest.json"
  - "https://ndlsearch.ndl.go.jp/books/R100000002-I000007324869"
verified_facts:
  - "「武州豊嶋郡江戸〔庄〕図」は寛永9年（1632）頃の刊とされ、NDLデジタルコレクションでPDM公開されている"
  - "同図は「正確な縮尺にもとづく表現ではなく」、収録地域も江戸城周辺の狭い範囲に限られるとNDLが解説している"
  - "「慶長年間江戸図考」は文化12年（1815）の写で、巻頭に彩色の「慶長年中江戸圖」を付すとNDLサーチが記す"
caveats:
  - "2点の資料は作成年代・縮尺・収録範囲が異なるため、重ね合わせには位置合わせ（幾何補正）の条件提示が必要"
  - "地図画像そのものの目視比較と、奥書の原本確認は未実施"
  - "「埋立前の正確な海岸線」を示す図ではない（NDLの解説に正確な海岸線の記載は無い）"
visual_assets: "模式図（重ね合わせ・縮尺比較・チェック項目）、NDL書誌情報の資料画面"
