topic: 鎌倉幕府の成立年（1185年と1192年）
viewer_question: 「いい国つくろう鎌倉幕府」の1192年は、なぜ教科書で1185年に変わったの？
audience: 一般視聴者・予備知識なし
source_urls:
  - "https://crd.ndl.go.jp/reference/entry/index.php?id=1000197449&page=ref_view"
  - "https://crd.ndl.go.jp/reference/entry/index.php?id=1000344905&page=ref_view"
  - "https://www.asahi.com/edu/student/kyoukashow/TKY200802270241.html"
  - "https://ja.wikipedia.org/wiki/鎌倉幕府"
verified_facts:
  - "国立国会図書館レファレンス協同データベース（愛知学院大学図書館、2016年）は、『日本大百科全書』『世界大百科事典』に成立時期の5説（1180東国独立国家の成立／1183寿永二年十月宣旨／1185守護・地頭設置の勅許／1190日本国総追捕使の地位確認／1192頼朝の征夷大将軍就任）があると回答している。『国史大辞典』は1184年（公文所・問注所設置）と1190年（右大将就任）を加えて7説とする。諸説に分かれるのは、幕府の本質のとらえ方の差違による、と同回答は記す（crd 1000197449）"
  - "同データベース（別事例 crd 1000344905）の調査：東京書籍の中学校『歴史』2006〜2011年度版は、本文に1185年の記述がなく、1192年に征夷大将軍に任命されたと書き、年表は1192年から鎌倉時代。2012〜2015年度版は、1185年に（守護・地頭を置くことを認めさせ）鎌倉幕府を開いたと書き、1192年に征夷大将軍に任命されたとも書く。欄外に「鎌倉幕府の成立時期には諸説がある」と記載、年表は1185年から鎌倉時代。2016〜2020年度版も同様"
  - "朝日新聞 asahi.com（2008-02-28）：東京書籍などによると、1192年は源頼朝が征夷大将軍に就いた年。頼朝は1185年、守護・地頭を任命する権利を得て、幕府の制度を整えた。東京書籍の社会編集部副編集長の話として「実質的に幕府が成立したのが85年。92年は征夷大将軍という『名』を得て名実ともに幕府が完成した年と考えられます」"
  - "Wikipedia『鎌倉幕府』：創設年は1180・1183・1185・1190・1192年など諸説あり。1192年7月12日に頼朝が朝廷から征夷大将軍を宣下された。『山槐記』によると、頼朝が望んだのは「大将軍」で、朝廷が惣官・征東大将軍・征夷大将軍・上将軍を検討し、征夷大将軍が吉例として選ばれた（Wikipedia の記述。『山槐記』原文は未確認）"
caveats:
  - "「1192年は誤り」「1185年が正解」と断定しない。年は『幕府の成立』を何で定義するかで変わる。複数説を併記する"
  - "「全国の教科書が1185年に変わった」とは言わない。確認できたのは東京書籍の中学校教科書の記述の変遷と、2008年朝日記事の「多くは1185年」という一般的な報道のみ"
  - "一次資料（『吾妻鏡』『山槐記』原文、教科書そのもの）は未確認。上記は図書館レファレンス事例・報道・Wikipedia に基づく。status は needs_review"
  - "「いい国つくろう」の語呂合わせの起源・普及時期は未確認のため扱わない"
  - "「いいはこ」1185の語呂は朝日記事の紹介にとどまる。動画では使うとしても『言われることがある』程度に留める"
visual_assets: "年表の模式図（1180〜1192の5つの出来事を横に並べる）、教科書の年表の模式図（実物の写真は使わない）。いずれも画面に『模式図』と明記する"
