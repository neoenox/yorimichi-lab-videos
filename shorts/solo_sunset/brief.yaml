topic: 夕焼けは、なぜ赤いのか？
viewer_question: '夕焼けが赤く見えるのは、なぜですか。空が青いのとどう関係しますか。'
audience: 一般視聴者・予備知識なし
source_urls:
  - https://www.jma.go.jp/jma/kishou/know/faq/faq13.html
verified_facts:
  - '太陽光は、波長の短い方から順番に、むらさき、青、緑、黄、だいだい、赤の光を含んでいる（気象庁FAQ本文、2026-11-26確認）'
  - '晴天時に太陽光は大気を通るとき空気分子によって散乱され、空気分子の大きさは光の波長に比べて非常に小さいため、波長の短い光がより強く散乱される（同）'
  - '波長の一番短い紫色の光は空の高いところで散乱されてしまい、地上に届く量は少なくなってしまう（同）'
  - '強く散乱された波長の短い光のうち、地上に届く量が多い青色の光が強調されて、晴天時の空は青く見える（同）'
  - '夕方は太陽が地平線に近いので、太陽光が大気を通過する距離が長くなり、波長の短い光は途中で散乱されてしまい、波長の長い赤色の光が多く地上に届く。このため夕焼けは赤く見える（同）'
caveats:
  - '原文にない「紫が消える」「青だけが残る」「大気が厚くなる」「紫がなくなる」などの断定は使わない。原文は「届く量は少なくなってしまいます」「青色の光が強調されて」という表現。'
  - '散乱の強さと波長の定量的な関係（乗数・レイリー散乱などの数式）は気象庁FAQに記載がなく、数字・数式は使わない。定性のみを使う。'
  - '波長の具体的な数値（nm）は両資料に記載がないため書かない。'
  - '気象庁本文だけを根拠にする。国立天文台FAQ（https://www.nao.ac.jp/faq/a0203.html）は補助確認にとどめ、画面の断定には使わない。'
