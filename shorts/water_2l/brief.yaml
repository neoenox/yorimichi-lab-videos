topic: 1日2リットルの水は本当に必要？
viewer_question: 「水は1日2リットル飲むべき」は本当？ 飲む量と必要な量は違うのでは？
audience: 一般視聴者・健康の思い込みを短時間で確かめたい人
source_urls:
  - "https://www.mhlw.go.jp/content/10904750/000586571.pdf"
verified_facts:
  - "厚生労働省『日本人の食事摂取基準』参考資料「水」（2026-11-22にPDFを取得しPyMuPDFで本文確認）: 水の必要量は生活活動レベルが低い集団で2.3〜2.5 L/日程度、生活活動レベルが高い集団で3.3〜3.5 L/日程度と推定されている（p.374）。"
  - "同資料: 日本人成人（30〜76歳）男女242人の習慣的な水摂取量は、男性2,423 g/日、女性2,037 g/日、男女合計2,230 g/日だった。"
  - "同資料: 水の摂取源は日本人では食物由来が1,130 g/日（51％）、飲物由来が1,100 g/日（49％）。めし・麺類など食物からの水分が半分近くを占める。"
  - "同資料: 水道水の摂取量に関する全国調査では、1人あたり平均1.28 L/日、潜在的な摂取量は平均1.65 L/日、2.0 L/日は88パーセンタイルに当たると推定されている。"
  - "同資料: 性・年齢・身体活動レベル別に水の必要量を算定する根拠が十分に整っておらず、健康な日本人の詳細な研究報告も成人で一つしかないため目安量を策定することは難しい、としている（p.375）。"
caveats:
  - "「1日2リットル飲まないといけない」と断定しない。2.3〜3.5 L/日は食物由来を含むtotal water needで、飲料水だけの目標ではない。"
  - "必要量は身体活動レベルで変わる。一律の個人目標として提示しない。"
  - "根拠は厚生労働省の参考資料（取得日2026-11-22）。2025年版本文との差分は未確認。"
  - "腎結石・慢性腎臓病・便秘などの個別疾患の話は本編で扱わない（資料にも根拠の強さに幅がある）。"
visual_assets: "コップと食事の模式図（飲物由来49％・食物由来51％）、活動レベル別の必要量比較図（低活動2.3〜2.5 L/日・高活動3.3〜3.5 L/日）。いずれも模式図と明記する。"
