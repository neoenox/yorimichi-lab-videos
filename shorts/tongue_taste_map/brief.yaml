topic: "舌の味覚マップは本当に存在しないのか"
viewer_question: "舌の先で甘味、奥で苦味を感じるって本当？"
audience: "一般視聴者・予備知識なし"
source_urls:
  - "https://pmc.ncbi.nlm.nih.gov/articles/PMC8956797/"
  - "https://www.shiminkagaku.org/wp/wp-content/uploads/csijnewsletter_062_202105_seno.pdf"
  - "https://www.jstage.jst.go.jp/article/kasei/67/0/67_25/_article/-char/ja/"
verified_facts:
  - "2022年の総説は、いわゆる舌の味覚マップは長く否定されてきたと述べる。舌のどの場所でも甘味・苦味・塩味・酸味・うま味の受容体が見つかり、きれいに分かれていない（Spence 2022、PMC本文）。"
  - "同総説は、1901年のHänigのデータが1942年のBoringの教科書で再描画され、小さな感度差が「その場所でしか感じない」という地図として誇張された経緯を説明する（Fig.1の説明と本文）。"
  - "ただし同総説は、舌の場所による感度の差がまったく無いわけではないとも書く。差は小さく、心理物理の実験では場所ごとの差が報告される（要旨・3節）。"
  - "市民研通信2021年の解説は、Hänigの原論文が味の感覚は舌全体に広がると注記し、4つの基本味の感度差は非常にわずかだったと紹介する（PDF本文16〜50行目を確認）。"
  - "市民研通信は、地図が広まった経路として1912年の新聞掲載なども挙げ、1942年のBoringの本だけで説明するのは不十分だとする（PDF本文76〜84行目を確認）。"
caveats:
  - "「味覚マップは存在しない」とだけ言うと、感度の小さな差まで否定したように聞こえる。『受容体はどこにもあり、地図のような専用区域はない。差は小さい』と両方を伝える。"
  - "1901年→1942年という単純な誤訳・誇張の物語は、市民研通信が慎重に疑問を出している。単線で断定しない。"
  - "大学の味覚閾値研究（J-Stage）はタイトルと要旨の一部のみ確認。詳細は未読で、台本の数値には使わない。"
visual_assets: "舌の模式図、1901年の感度グラフと地図の比較模式図、味覚受容体の分布模式図。いずれも模式図と明記する"
