topic: 神護寺の「伝源頼朝像」（昔は「源頼朝の肖像画」と習った絵）と足利直義説
viewer_question: 「学校で源頼朝の顔として覚えたあの肖像画は、いま別の人の説になっているって本当？」
audience: 一般視聴者・予備知識なし。40代以上（昭和期に「源頼朝の肖像」として習った層）を主に想定
source_urls:
  - "https://kunishitei.bunka.go.jp/bsys/maindetails/201/14"
  - "https://online.bunka.go.jp/heritages/detail/188556"
  - "https://www.jingoji.or.jp/treasure16.html"
  - "https://www.nippon.com/ja/articles/-/3144"
  - "https://news.tv-asahi.co.jp/news_society/articles/900174232.html"
  - "https://www.teikokushoin.co.jp/faq/detail/942/"
  - "https://www.kyohaku.go.jp/jp/collection/meihin/shouzouga/item01/"
  - "https://crd.ndl.go.jp/reference/entry/index.php?id=1000273133&page=ref_view"
  - "https://ja.wikipedia.org/wiki/神護寺三像"
verified_facts:
  - "文化庁の国指定文化財等データベースの名称は「絹本著色伝源頼朝像」（頭に「伝」が付く）。員数1幅、種別は絵画、時代は「鎌倉」、作者は「伝藤原隆信」、国宝指定年月日は1951.06.09（昭和26.06.09）、所有者は神護寺、所在は京都府（kunishitei 201/14。2026-11-12 取得）"
  - "文化遺産オンラインの同一作品ページでも名称「絹本著色伝源頼朝像」、員数「1幅」、国宝指定年月日19510609、所有者「神護寺」、解説は「鎌倉時代の作品。」（online.bunka 188556。2026-11-12 取得）"
  - "国立国会図書館レファレンス協同データベース（京都市図書館、登録番号1000273133、事例作成2020-01-29）の回答に、1951年の文化財保護法下の国宝指定名称が「絹本著色伝源頼朝像 絹本著色伝平重盛像 絹本著色伝藤原光能像 三幅（各幅伝藤原隆信筆）」と「“伝”が付いた名称となった」とある。あわせて旧国宝（1897年、古社寺保存法）の名称は「源頼朝外三人肖像絹本著色掛幅（伝藤原隆信筆）」だったと記す"
  - "1995年に美術史家・米倉迪夫が、この像を足利直義とする新説を発表した（神護寺公式ページ・nippon.com 2022-02-27・帝国書院FAQ の3資料で一致）"
  - "神護寺公式ページ（treasure16.html）は「現時点では、伝源頼朝像の表記を変更する必要はない」「時代も、十三世紀初頭をくだらないというのが穏当なところであろう」と明記し、宮島新一・近藤好和の反論を紹介している（所蔵者自身が新説に反論している）"
  - "nippon.com（2022-02-27、小林明）に「およそ40歳代以上の日本人が「源頼朝」と聞いて思い浮かべる肖像画が、『実は、頼朝ではない』として、書籍や雑誌が掲載を見送るようになっている。掲載する場合も、『伝源頼朝』と『伝』を付ける」とある"
  - "テレビ朝日（グッド！モーニング 2025-08-13 放送分、記事2026-06-21）で河合敦氏が「僕が調べた限りは、小・中学校の教科書から消えています」「木像を源頼朝として掲載している教科書が多い」と述べている"
  - "帝国書院FAQは「源頼朝像の肖像というと、かつては京都府の神護寺にある国宝「伝源頼朝像」が教科書にも大きく取り扱われる定番でした」「これらの状況から、神護寺の「伝源頼朝像」は、足利直義とする説が有力になっています」「弊社では甲斐善光寺の坐像を、源頼朝として紹介しています」と記す"
  - "京都国立博物館の名品紹介は「伝源頼朝像」として「国宝」「1幅」「絹本著色」「縦143.0cm 横112.8cm」「鎌倉時代 13世紀」「京都・神護寺」とし、「鎌倉前期の大和絵肖像画の代表的傑作である」と記す（足利直義説には触れていない）"
  - "米倉説の主な論拠として、冠・太刀の形式が鎌倉末期以降のものであること、絵絹の大きさ・材質、面貌表現が14世紀中期の肖像と似ること、康永4年（1345年）の足利直義願文（尊氏と自分の像を神護寺に奉納したと記す）が挙げられている（神護寺公式・nippon.com・Wikipedia で一致）"
  - "論争は決着していない。歴史学からは新説を支持する意見、美術史からは反対意見が出されており、Wikipedia は「今なお議論があるものの、概ね新説が定着しつつある」と記す（Wikipedia のみの評価表現）"
caveats:
  - "「足利直義で確定」と断定しない。所蔵者の神護寺は公式に反論しており、論争は続いている。動画では『有力な説』『決着はついていない』と表現する"
  - "「全国の教科書が一斉に変わった」とは言わない。確認できたのは nippon.com の『学校教科書からはほぼ消え』、テレビ朝日の『小・中学校の教科書から消えています』、帝国書院FAQ の自社方針のみ。会社別・年度別の一次比較は未実施"
  - "教科書の表記が『源頼朝』から『伝源頼朝像』へいつ変わったかは未確認。国宝指定名称が1951年時点で既に『伝』付きだったことと、教科書表記の変化は別の話として扱う"
  - "帝国書院FAQは願文の年を『1354年』と書くが、神護寺公式・nippon.com・Wikipedia はいずれも康永4年＝1345年。動画では年を出さず『南北朝時代の願文』とだけ言う（1桁違いの食い違いがあるため）"
  - "米倉迪夫の原著『源頼朝像 沈黙の肖像画』（平凡社、1995）、黒田日出男の著書、宮島新一・近藤好和の原著は未参照。参照できたのは二次資料（Wikipedia・nippon.com・帝国書院FAQ・神護寺公式）"
  - "『40代以上』は nippon.com 1社の表現。統計的な調査の数字ではない"
  - "肖像画像は Wikimedia Commons の File:Minamoto no Yoritomo.jpg を使う。ライセンスは PD-Art（PD-old-100-expired, deathyear=1205）でパブリックドメインだが、出典・撮影者は『Unknown source（不明）』と明記されている。所蔵者（神護寺）撮影の画像ではないため、京博の画像利用規定（申請・有料）の対象外と判断した。この判断自体は法的助言ではない"
  - "肖像は『源頼朝と確定した絵』として出さない。画面に『伝源頼朝像（神護寺蔵）』『国宝』『画像：Wikimedia Commons（PD）』を添え、断定の絵ではないことを示す"
visual_assets: "Wikimedia Commons の PD 画像（神護寺蔵・伝源頼朝像、1584x1974）を背景に使う。顔の拡大・全体・冠と太刀の部分拡大の3種類と、自作の暗色グラデーションを組み合わせる。図（年表・2択・論争の構図・根拠の札）は自作で、すべて画面に『模式図』と明記する"
