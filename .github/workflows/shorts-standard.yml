name: Shorts standard

# 制作標準（shorts-standard/）の形式検査と、ゲートの緩和検知。
# 認証情報も外部APIも使わない。
on:
  pull_request:
    paths:
      - 'shorts-standard/**'
      - 'scripts/shorts_standard.py'
      - 'tests/test_shorts_standard.py'
      - 'shorts/**'
      - 'requirements.txt'
      - '.github/workflows/shorts-standard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validators
        run: python -m pip install --quiet jsonschema pyyaml
      - name: Compile
        run: python -m py_compile scripts/shorts_standard.py shorts-standard/validate.py tests/test_shorts_standard.py
      - name: Rule guard and gate tests
        run: python -m unittest discover -s tests -p 'test_shorts_standard.py' -v

  validate-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --quiet jsonschema pyyaml
      - name: Validate every shorts project
        run: |
          shopt -s nullglob
          files=(shorts/*/result.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'no shorts projects yet'
            exit 0
          fi
          rc=0
          for f in "${files[@]}"; do
            echo "== $f"
            python scripts/shorts_standard.py check "$f" || rc=1
          done
          exit $rc
