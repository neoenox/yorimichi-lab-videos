name: Doctor diagnostics regression

on:
  push:
    branches: [fix/doctor-optional-resources-20261101]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  doctor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install "pytest==9.0.2" "psutil==7.2.2"
      - name: Check Python syntax
        run: python -m compileall -q scripts/doctor.py scripts/test_doctor.py
      - name: Run focused regression tests
        run: python -m pytest -q scripts/test_doctor.py
